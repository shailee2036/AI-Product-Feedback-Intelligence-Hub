name: ci

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "24"
  FEEDBACK_HUB_ENVIRONMENT: test

jobs:
  backend-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Format
        run: ruff format --check .
      - name: Lint
        run: ruff check --output-format=github .
      - name: Type check
        run: mypy
      - name: Audit dependencies
        run: pip-audit --skip-editable

  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Unit tests with coverage floor
        run: pytest -m "not integration"

  integration-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg17@sha256:ac08538c6f8b9904c33c8224c5e5706dbe760aca29db1d096972b4052c22a75d
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      FEEDBACK_HUB_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - name: Apply migrations to a clean database
        run: |
          createdb migration_check
          cat supabase/tests/auth_stub.sql supabase/migrations/*.sql \
            | psql -d migration_check -v ON_ERROR_STOP=1 -q
      - name: Row-level security tests
        run: psql -d migration_check -v ON_ERROR_STOP=1 -q -f supabase/tests/rls_test.sql
      - run: pip install -e ".[dev]"
        working-directory: apps/api
      - name: API integration tests
        working-directory: apps/api
        run: pytest -m integration --cov-fail-under=0

  frontend-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Unit tests with coverage floor
        run: npm run test:coverage
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Production build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
          API_URL: http://127.0.0.1:8000
        run: npm run build

  seed-data-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - run: pip install -e apps/api
      - name: Validate seed fixtures
        run: python -m feedback_hub.seed.validate seed-data

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Gitleaks
        run: >-
          docker run --rm -v "$GITHUB_WORKSPACE:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1
          git /repo --redact --verbose --exit-code 1

  workflow-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color

  container-build-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [backend-quality, unit-tests, integration-tests]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build API image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: apps/api
          load: true
          push: false
          tags: feedback-hub-api:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Smoke test container
        run: |
          docker run -d --name api -p 8000:8000 "feedback-hub-api:${GITHUB_SHA}"
          for _ in $(seq 1 20); do
            curl -fsS http://localhost:8000/health/live && exit 0
            sleep 1
          done
          docker logs api
          exit 1
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: feedback-hub-api:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Generate image SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: feedback-hub-api:${{ github.sha }}
          format: cyclonedx
          output: feedback-hub-api.cdx.json
          skip-setup-trivy: true
      - name: Check SBOM
        run: |
          jq -e '.bomFormat == "CycloneDX" and (.components | length) > 0' feedback-hub-api.cdx.json > /dev/null
          jq -e '[.components[].name] | index("fastapi")' feedback-hub-api.cdx.json > /dev/null
      - name: Upload SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: feedback-hub-api-sbom
          path: feedback-hub-api.cdx.json
          retention-days: 30
          if-no-files-found: error

  helm-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Helm
        run: |
          version=v3.17.4
          curl -fsSL -o helm.tgz "https://get.helm.sh/helm-${version}-linux-amd64.tar.gz"
          tar -xzf helm.tgz
          sudo mv linux-amd64/helm /usr/local/bin/helm
          helm version
      - name: Install kubeconform
        run: |
          version=v0.8.0
          curl -fsSL -o kubeconform.tar.gz "https://github.com/yannh/kubeconform/releases/download/${version}/kubeconform-linux-amd64.tar.gz"
          echo "9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883  kubeconform.tar.gz" | sha256sum -c -
          tar -xzf kubeconform.tar.gz
          sudo mv kubeconform /usr/local/bin/kubeconform
          kubeconform -v
      - name: Install Conftest
        run: |
          version=0.71.1
          curl -fsSL -o conftest.tar.gz "https://github.com/open-policy-agent/conftest/releases/download/v${version}/conftest_${version}_Linux_x86_64.tar.gz"
          echo "c3f6b2a753bd56e377a1e51a95ae3e057f926f2e9139f7d5b5dfbbaf810f7985  conftest.tar.gz" | sha256sum -c -
          tar -xzf conftest.tar.gz
          sudo mv conftest /usr/local/bin/conftest
          conftest --version
      - name: Lint, render, and validate the charts
        run: |
          tag="${GITHUB_SHA}"
          helm lint deploy/charts/api --set "image.tag=${tag}"
          helm template feedback-hub-api deploy/charts/api --set "image.tag=${tag}" > rendered.yaml
          grep -q "cpu:" rendered.yaml
          grep -q "/health/live" rendered.yaml
          grep -q "/health/ready" rendered.yaml
          grep -q "runAsNonRoot: true" rendered.yaml
          if grep -Eq "privileged: true|hostNetwork: true|:latest" rendered.yaml; then
            echo "Rendered chart violates the CPU deployment policy."
            exit 1
          fi
          kubeconform -strict -summary -kubernetes-version 1.37.0 rendered.yaml
          conftest test --policy deploy/policy rendered.yaml
          helm lint deploy/charts/litellm
          helm template feedback-hub-litellm deploy/charts/litellm > litellm.yaml
          kubeconform -strict -summary -kubernetes-version 1.37.0 litellm.yaml
          conftest test --policy deploy/policy litellm.yaml
          helm lint deploy/charts/monitoring --strict
          helm template feedback-hub-monitoring deploy/charts/monitoring > monitoring.yaml
          kubeconform -strict -summary -kubernetes-version 1.37.0 monitoring.yaml
          conftest test --policy deploy/policy monitoring.yaml
          for dashboard in deploy/charts/monitoring/dashboards/*.json; do
            jq -e '.uid and .title and (.panels | length > 0)' "$dashboard" > /dev/null
          done
          mkdir -p prometheus-config
          helm template feedback-hub-monitoring deploy/charts/monitoring --show-only templates/prometheus-configmap.yaml > prometheus-configmap.yaml
          yq '.data["prometheus.yml"]' prometheus-configmap.yaml > prometheus-config/prometheus.yml
          yq '.data["rules.yml"]' prometheus-configmap.yaml > prometheus-config/rules.yml
          prometheus_image="$(yq '.prometheus.image.repository + "@" + .prometheus.image.digest' deploy/charts/monitoring/values.yaml)"
          docker run --rm -v "${PWD}/prometheus-config:/etc/prometheus:ro" --entrypoint promtool "$prometheus_image" check config /etc/prometheus/prometheus.yml
          docker run --rm -v "${PWD}/prometheus-config:/etc/prometheus:ro" --entrypoint promtool "$prometheus_image" check rules /etc/prometheus/rules.yml
          mkdir -p tempo-check
          helm template feedback-hub-monitoring deploy/charts/monitoring --show-only templates/tempo-configmap.yaml > tempo-configmap.yaml
          yq '.data["config.yaml"]' tempo-configmap.yaml > tempo-check/config.yaml
          tempo_image="$(yq '.tempo.image.repository + "@" + .tempo.image.digest' deploy/charts/monitoring/values.yaml)"
          docker rm -f tempo-check >/dev/null 2>&1 || true
          docker run -d --name tempo-check -v "${PWD}/tempo-check/config.yaml:/etc/tempo/config.yaml:ro" -p 3200:3200 "$tempo_image" -config.file=/etc/tempo/config.yaml
          ready=""
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3200/ready >/dev/null; then
              ready="yes"
              break
            fi
            sleep 1
          done
          if [[ -z "$ready" ]]; then
            docker logs tempo-check || true
            docker rm -f tempo-check >/dev/null 2>&1 || true
            echo "Tempo did not become ready."
            exit 1
          fi
          docker rm -f tempo-check >/dev/null 2>&1 || true
          email_sets=(
            --set alertEmail.enabled=true
            --set alertEmail.to=alerts@example.com
            --set alertEmail.from=alerts@example.com
            --set alertEmail.user=alerts@example.com
            --set alertEmail.host=smtp.example.com
            --set alertEmail.existingSecret=feedback-hub-smtp
          )
          helm template feedback-hub-monitoring deploy/charts/monitoring "${email_sets[@]}" > monitoring-email.yaml
          kubeconform -strict -summary -kubernetes-version 1.37.0 monitoring-email.yaml
          conftest test --policy deploy/policy monitoring-email.yaml
          mkdir -p alertmanager-check/smtp
          printf 'placeholder' > alertmanager-check/smtp/password
          helm template feedback-hub-monitoring deploy/charts/monitoring "${email_sets[@]}" --show-only templates/alertmanager-configmap.yaml > alertmanager-configmap.yaml
          yq '.data["alertmanager.yml"]' alertmanager-configmap.yaml > alertmanager-check/alertmanager.yml
          alertmanager_image="$(yq '.alertEmail.image.repository + "@" + .alertEmail.image.digest' deploy/charts/monitoring/values.yaml)"
          docker run --rm \
            -v "${PWD}/alertmanager-check/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro" \
            -v "${PWD}/alertmanager-check/smtp:/etc/alertmanager/smtp:ro" \
            --entrypoint amtool "$alertmanager_image" check-config /etc/alertmanager/alertmanager.yml
          cloud_sets=(
            --set grafanaCloud.enabled=true
            --set grafanaCloud.existingSecret=feedback-hub-grafana-cloud
            --set grafanaCloud.metrics.url=https://prometheus.example.com/api/prom/push
            --set grafanaCloud.metrics.username=1
            --set grafanaCloud.logs.url=https://logs.example.com/loki/api/v1/push
            --set grafanaCloud.logs.username=1
            --set grafanaCloud.traces.url=https://otlp.example.com/otlp
            --set grafanaCloud.traces.username=1
          )
          helm template feedback-hub-monitoring deploy/charts/monitoring "${cloud_sets[@]}" > monitoring-cloud.yaml
          kubeconform -strict -summary -kubernetes-version 1.37.0 monitoring-cloud.yaml
          conftest test --policy deploy/policy monitoring-cloud.yaml
          mkdir -p cloud-check
          helm template feedback-hub-monitoring deploy/charts/monitoring "${cloud_sets[@]}" --show-only templates/prometheus-configmap.yaml > cloud-prometheus-configmap.yaml
          yq '.data["prometheus.yml"]' cloud-prometheus-configmap.yaml > cloud-check/prometheus.yml
          yq '.data["rules.yml"]' cloud-prometheus-configmap.yaml > cloud-check/rules.yml
          printf 'placeholder' > cloud-check/token
          docker run --rm \
            -v "${PWD}/cloud-check:/etc/prometheus:ro" \
            -v "${PWD}/cloud-check/token:/etc/grafana-cloud/token:ro" \
            --entrypoint promtool "$prometheus_image" check config /etc/prometheus/prometheus.yml
          alloy_image="$(yq '.alloy.image.repository + "@" + .alloy.image.digest' deploy/charts/monitoring/values.yaml)"
          mkdir -p alloy-check
          helm template feedback-hub-monitoring deploy/charts/monitoring --show-only templates/alloy-configmap.yaml | yq '.data["config.alloy"]' > alloy-check/default.alloy
          helm template feedback-hub-monitoring deploy/charts/monitoring "${cloud_sets[@]}" --show-only templates/alloy-configmap.yaml | yq '.data["config.alloy"]' > alloy-check/cloud.alloy
          for config in default cloud; do
            docker run --rm -v "${PWD}/alloy-check:/cfg:ro" "$alloy_image" validate "/cfg/${config}.alloy"
          done
          if conftest test --policy deploy/policy deploy/policy/testdata/rejected.yaml; then
            echo "Policy did not reject the fixture."
            exit 1
          fi

  chart-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [container-build-scan]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build API image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: apps/api
          load: true
          push: false
          tags: feedback-hub-api:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Install Helm
        run: |
          version=v3.17.4
          curl -fsSL -o helm.tgz "https://get.helm.sh/helm-${version}-linux-amd64.tar.gz"
          tar -xzf helm.tgz
          sudo mv linux-amd64/helm /usr/local/bin/helm
          helm version
      - name: Install kind
        run: |
          curl -fsSL -o kind "https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-linux-amd64"
          echo "aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d  kind" | sha256sum -c -
          chmod +x kind
          sudo mv kind /usr/local/bin/kind
          kind version
      - name: Install kubectl
        run: |
          curl -fsSL -o kubectl "https://dl.k8s.io/release/v1.37.0/bin/linux/amd64/kubectl"
          echo "6129359f4e1f3848a5572ccb0b26cf28b8ca08cef38c95a765b2f64a2c961a2f  kubectl" | sha256sum -c -
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/kubectl
          kubectl version --client
      - name: Smoke test the chart
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: bash deploy/scripts/kind-smoke.sh
      - name: Delete the kind cluster
        if: always()
        run: kind delete cluster --name feedback-hub-smoke || true
