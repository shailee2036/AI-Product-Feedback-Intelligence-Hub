{{- if .Values.alertEmail.enabled }}
{{- include "feedback-hub-monitoring.alertEmailRequired" . }}
{{- $email := .Values.alertEmail }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "feedback-hub-monitoring.alertmanager" . }}
  labels:
    {{- include "feedback-hub-monitoring.labels" (list . (include "feedback-hub-monitoring.alertmanager" .)) | nindent 4 }}
data:
  alertmanager.yml: |
    global:
      resolve_timeout: 5m
      smtp_smarthost: {{ printf "%s:%v" $email.host $email.smtpPort | quote }}
      smtp_from: {{ $email.from | quote }}
      smtp_auth_username: {{ $email.user | quote }}
      smtp_auth_password_file: /etc/alertmanager/smtp/password
      smtp_require_tls: true
    route:
      receiver: email
      group_by: ["alertname"]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
    receivers:
      - name: email
        email_configs:
          - to: {{ $email.to | quote }}
            send_resolved: true
{{- end }}
