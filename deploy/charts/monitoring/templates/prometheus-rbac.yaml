apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "feedback-hub-monitoring.prometheus" . }}
  labels:
    {{- include "feedback-hub-monitoring.labels" (list . (include "feedback-hub-monitoring.prometheus" .)) | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "feedback-hub-monitoring.prometheus" . }}
  labels:
    {{- include "feedback-hub-monitoring.labels" (list . (include "feedback-hub-monitoring.prometheus" .)) | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "feedback-hub-monitoring.prometheus" . }}
  labels:
    {{- include "feedback-hub-monitoring.labels" (list . (include "feedback-hub-monitoring.prometheus" .)) | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "feedback-hub-monitoring.prometheus" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "feedback-hub-monitoring.prometheus" . }}
    namespace: {{ .Release.Namespace }}
