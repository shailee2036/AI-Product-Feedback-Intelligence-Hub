apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "feedback-hub-monitoring.prometheus" . }}
  labels:
    {{- include "feedback-hub-monitoring.labels" (list . (include "feedback-hub-monitoring.prometheus" .)) | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "feedback-hub-monitoring.selectorLabels" (list . (include "feedback-hub-monitoring.prometheus" .)) | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "feedback-hub-monitoring.selectorLabels" (list . (include "feedback-hub-monitoring.grafana" .)) | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.prometheus.port }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "feedback-hub-monitoring.grafana" . }}
  labels:
    {{- include "feedback-hub-monitoring.labels" (list . (include "feedback-hub-monitoring.grafana" .)) | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "feedback-hub-monitoring.selectorLabels" (list . (include "feedback-hub-monitoring.grafana" .)) | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: TCP
          port: {{ .Values.grafana.port }}
