apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "feedback-hub-monitoring.tempo" . }}
  labels:
    {{- include "feedback-hub-monitoring.labels" (list . (include "feedback-hub-monitoring.tempo" .)) | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "feedback-hub-monitoring.selectorLabels" (list . (include "feedback-hub-monitoring.tempo" .)) | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "feedback-hub-monitoring.selectorLabels" (list . (include "feedback-hub-monitoring.grafana" .)) | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.tempo.httpPort }}
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: feedback-hub-api
        - podSelector:
            matchLabels:
              {{- include "feedback-hub-monitoring.selectorLabels" (list . (include "feedback-hub-monitoring.alloy" .)) | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.tempo.otlpPort }}
---
apiVersion: networking.k8s.io/v1
