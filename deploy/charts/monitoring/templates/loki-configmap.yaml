apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "feedback-hub-monitoring.loki" . }}
  labels:
    {{- include "feedback-hub-monitoring.labels" (list . (include "feedback-hub-monitoring.loki" .)) | nindent 4 }}
data:
  local-config.yaml: |
    auth_enabled: false
    server:
      http_listen_port: {{ .Values.loki.port }}
    common:
      instance_addr: 127.0.0.1
      path_prefix: /loki
      storage:
        filesystem:
          chunks_directory: /loki/chunks
          rules_directory: /loki/rules
      replication_factor: 1
      ring:
        kvstore:
          store: inmemory
    schema_config:
      configs:
        - from: 2020-10-24
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h
    limits_config:
      retention_period: {{ .Values.loki.retention }}
      reject_old_samples: true
      reject_old_samples_max_age: {{ .Values.loki.retention }}
    analytics:
      reporting_enabled: false
