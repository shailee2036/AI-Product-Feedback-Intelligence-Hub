{{- $cloud := .Values.grafanaCloud }}
{{- if $cloud.enabled }}
{{- include "feedback-hub-monitoring.grafanaCloudRequired" . }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "feedback-hub-monitoring.alloy" . }}
  labels:
    {{- include "feedback-hub-monitoring.labels" (list . (include "feedback-hub-monitoring.alloy" .)) | nindent 4 }}
data:
  config.alloy: |
    discovery.kubernetes "pods" {
      role = "pod"
      namespaces {
        names = [{{ .Release.Namespace | quote }}]
      }
    }

    discovery.relabel "pods" {
      targets = discovery.kubernetes.pods.targets

      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        target_label  = "namespace"
      }

      rule {
        source_labels = ["__meta_kubernetes_pod_name"]
        target_label  = "pod"
      }

      rule {
        source_labels = ["__meta_kubernetes_pod_container_name"]
        target_label  = "container"
      }

      rule {
        source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
        target_label  = "service_name"
      }
    }

    loki.source.kubernetes "pods" {
      targets    = discovery.relabel.pods.output
      forward_to = [
        loki.write.default.receiver,
        {{- if $cloud.enabled }}
        loki.relabel.grafana_cloud.receiver,
        {{- end }}
      ]
    }

    loki.write "default" {
      endpoint {
        url = "http://{{ include "feedback-hub-monitoring.loki" . }}:{{ .Values.loki.port }}/loki/api/v1/push"
      }
    }
    {{- if $cloud.enabled }}

    // Only API logs leave the cluster.
    loki.relabel "grafana_cloud" {
      forward_to = [loki.write.grafana_cloud.receiver]

      rule {
        source_labels = ["service_name"]
        regex         = "feedback-hub-api"
        action        = "keep"
      }
    }

    loki.write "grafana_cloud" {
      endpoint {
        url = {{ $cloud.logs.url | quote }}

        basic_auth {
          username = {{ $cloud.logs.username | quote }}
          password = sys.env("GRAFANA_CLOUD_TOKEN")
        }
      }
    }
    {{- end }}

    otelcol.receiver.otlp "default" {
      http {
        endpoint = "0.0.0.0:{{ .Values.alloy.otlpPort }}"
      }

      output {
        traces = [otelcol.processor.batch.default.input]
      }
    }

    otelcol.processor.batch "default" {
      output {
        traces = [
          otelcol.exporter.otlphttp.tempo.input,
          {{- if $cloud.enabled }}
          otelcol.exporter.otlphttp.grafana_cloud.input,
          {{- end }}
        ]
      }
    }

    otelcol.exporter.otlphttp "tempo" {
      client {
        endpoint = "http://{{ include "feedback-hub-monitoring.tempo" . }}:{{ .Values.tempo.otlpPort }}"
      }
    }
    {{- if $cloud.enabled }}

    otelcol.auth.basic "grafana_cloud" {
      username = {{ $cloud.traces.username | quote }}
      password = sys.env("GRAFANA_CLOUD_TOKEN")
    }

    otelcol.exporter.otlphttp "grafana_cloud" {
      client {
        endpoint = {{ $cloud.traces.url | quote }}
        auth     = otelcol.auth.basic.grafana_cloud.handler
      }
    }
    {{- end }}
