{{- $p := .Values.prometheus }}
{{- if or (not $p.resources.requests.cpu) (not $p.resources.limits.cpu) }}
{{- fail "Prometheus CPU requests and limits are required." }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "feedback-hub-monitoring.prometheus" . }}
  labels:
    {{- include "feedback-hub-monitoring.labels" (list . (include "feedback-hub-monitoring.prometheus" .)) | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "feedback-hub-monitoring.selectorLabels" (list . (include "feedback-hub-monitoring.prometheus" .)) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "feedback-hub-monitoring.selectorLabels" (list . (include "feedback-hub-monitoring.prometheus" .)) | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/prometheus-configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "feedback-hub-monitoring.prometheus" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: prometheus
          image: {{ include "feedback-hub-monitoring.image" $p.image | quote }}
          imagePullPolicy: {{ $p.image.pullPolicy }}
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time={{ $p.retention.time }}
            - --storage.tsdb.retention.size={{ $p.retention.size }}
            - --web.listen-address=:{{ $p.port }}
          ports:
            - name: http
              containerPort: {{ $p.port }}
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            {{- toYaml $p.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
              readOnly: true
            - name: data
              mountPath: /prometheus
            {{- if .Values.grafanaCloud.enabled }}
            - name: grafana-cloud
              mountPath: /etc/grafana-cloud
              readOnly: true
            {{- end }}
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            periodSeconds: 10
      volumes:
        - name: config
          configMap:
            name: {{ include "feedback-hub-monitoring.prometheus" . }}
        - name: data
          emptyDir:
            sizeLimit: {{ $p.storageSizeLimit }}
        {{- if .Values.grafanaCloud.enabled }}
        - name: grafana-cloud
          secret:
            secretName: {{ .Values.grafanaCloud.existingSecret | quote }}
            defaultMode: 0440
            items:
              - key: {{ .Values.grafanaCloud.tokenKey | quote }}
                path: token
        {{- end }}
