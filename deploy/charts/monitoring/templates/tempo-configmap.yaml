apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "feedback-hub-monitoring.tempo" . }}
  labels:
    {{- include "feedback-hub-monitoring.labels" (list . (include "feedback-hub-monitoring.tempo" .)) | nindent 4 }}
data:
  config.yaml: |
    server:
      http_listen_port: {{ .Values.tempo.httpPort }}
    distributor:
      receivers:
        otlp:
          protocols:
            http:
              endpoint: 0.0.0.0:{{ .Values.tempo.otlpPort }}
    ingester:
      trace_idle_period: 10s
      max_block_duration: 5m
    compactor:
      compaction:
        block_retention: 168h
    storage:
      trace:
        backend: local
        wal:
          path: /var/tempo/wal
        local:
          path: /var/tempo/blocks
    usage_report:
      reporting_enabled: false
