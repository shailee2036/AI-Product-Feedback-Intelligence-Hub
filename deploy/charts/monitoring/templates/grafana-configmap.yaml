apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "feedback-hub-monitoring.grafana" . }}-provisioning
  labels:
    {{- include "feedback-hub-monitoring.labels" (list . (include "feedback-hub-monitoring.grafana" .)) | nindent 4 }}
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://{{ include "feedback-hub-monitoring.prometheus" . }}:{{ .Values.prometheus.port }}
        isDefault: true
        editable: false
      - name: Loki
        uid: loki
        type: loki
        access: proxy
        url: http://{{ include "feedback-hub-monitoring.loki" . }}:{{ .Values.loki.port }}
        editable: false
      - name: Tempo
        uid: tempo
        type: tempo
        access: proxy
        url: http://{{ include "feedback-hub-monitoring.tempo" . }}:{{ .Values.tempo.httpPort }}
        editable: false
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: feedback-hub
        folder: Feedback Hub
        type: file
        disableDeletion: true
        allowUiUpdates: false
        options:
          path: /etc/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "feedback-hub-monitoring.grafana" . }}-dashboards
  labels:
    {{- include "feedback-hub-monitoring.labels" (list . (include "feedback-hub-monitoring.grafana" .)) | nindent 4 }}
data:
  {{- range $path, $_ := .Files.Glob "dashboards/*.json" }}
  {{ base $path }}: |
    {{- $.Files.Get $path | nindent 4 }}
  {{- end }}
