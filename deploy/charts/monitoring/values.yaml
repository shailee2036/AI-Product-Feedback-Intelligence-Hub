# Off unless a recipient and an SMTP secret are supplied at install time.
# The chart never stores the password.
alertEmail:
  enabled: false
  to: ""
  from: ""
  user: ""
  host: ""
  smtpPort: 587
  port: 9093
  existingSecret: ""
  passwordKey: password

  image:
    repository: docker.io/prom/alertmanager
    tag: v0.34.1
    digest: sha256:e9733bafb1bdef9b00e25a21f8f99dc26a22224bf16641ad754d1649f4c3357a
    pullPolicy: IfNotPresent

  port: 9093

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

grafana:
  image:
    repository: docker.io/grafana/grafana
    tag: 13.2.4
    digest: sha256:dbbc38ea21103cefb50396340cd88afec779c7e070b0a7bf5a75b4ce46651d3f
    pullPolicy: IfNotPresent

  port: 3000

  # Name of a Secret created outside this chart with keys admin-user and admin-password.
  # Do not put those values here.
  existingSecret: feedback-hub-grafana

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
