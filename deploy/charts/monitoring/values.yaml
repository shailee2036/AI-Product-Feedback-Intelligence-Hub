prometheus:
  image:
    repository: docker.io/prom/prometheus
    tag: v3.15.0
    digest: sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e
    pullPolicy: IfNotPresent

  port: 9090
  scrapeInterval: 15s

  # Running pods in the release namespace with this app name are scraped on the named
  # container port. Discovery is limited to that namespace by a Role, not a ClusterRole.
  scrapeTargets:
    - job: feedback-hub-api
      appName: feedback-hub-api
      portName: http
      path: /metrics

  # Data is kept in an emptyDir and is lost when the pod is rescheduled.
  retention:
    time: 7d
    size: 1GB
  storageSizeLimit: 2Gi

  alerts:
    errorRatio: 0.05
    latencyP95Seconds: 2
    restartsPer30m: 2
    providerFailureRatio: 0.2

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi

loki:
  image:
    repository: docker.io/grafana/loki
    tag: "3.7.8"
    digest: sha256:1107dd5274e0ada47e42472b7a7e71f3b2a2fe878878108f3e2f9e51528f0193
    pullPolicy: IfNotPresent

  port: 3100

  # Log chunks are kept in an emptyDir and are lost when the pod is rescheduled.
  retention: 168h
  storageSizeLimit: 2Gi

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 768Mi

