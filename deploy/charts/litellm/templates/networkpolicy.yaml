{{- if not .Values.allowedClients }}
{{- fail "allowedClients is required so only the API can reach the proxy." }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "feedback-hub-litellm.name" . }}
  labels:
    {{- include "feedback-hub-litellm.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "feedback-hub-litellm.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- toYaml .Values.allowedClients | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.service.port }}
