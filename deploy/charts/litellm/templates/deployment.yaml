{{- if not .Values.existingSecret }}
{{- fail "existingSecret is required. Do not put credentials in values." }}
{{- end }}
{{- if or (not .Values.resources.requests.cpu) (not .Values.resources.limits.cpu) }}
{{- fail "CPU requests and limits are required." }}
{{- end }}
{{- if not .Values.models }}
{{- fail "At least one model is required." }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "feedback-hub-litellm.name" . }}
  labels:
    {{- include "feedback-hub-litellm.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "feedback-hub-litellm.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "feedback-hub-litellm.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: litellm
          image: {{ include "feedback-hub-litellm.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --config
            - /etc/litellm/config.yaml
            - --port
            - {{ .Values.service.port | quote }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          envFrom:
            - secretRef:
                name: {{ .Values.existingSecret | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/litellm
              readOnly: true
            - name: tmp
              mountPath: /tmp
          startupProbe:
            httpGet:
              path: /health/liveliness
              port: http
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /health/liveliness
              port: http
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: http
            periodSeconds: 10
      volumes:
        - name: config
          configMap:
            name: {{ include "feedback-hub-litellm.name" . }}
        - name: tmp
          emptyDir: {}
