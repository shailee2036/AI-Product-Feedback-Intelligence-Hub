replicaCount: 1

image:
  repository: ghcr.io/shailee2036/feedback-hub-api
  # Immutable commit SHA. "latest" is rejected. A digest overrides the tag.
  tag: ""
  digest: ""
  pullPolicy: IfNotPresent

service:
  port: 8000

# Name of a Secret created outside this chart. Expected keys include
# FEEDBACK_HUB_DATABASE_URL, FEEDBACK_HUB_SUPABASE_URL, FEEDBACK_HUB_GEMINI_API_KEY,
# and FEEDBACK_HUB_GROQ_API_KEY. Do not put those values here.
existingSecret: feedback-hub-api

# In-cluster LiteLLM proxy, for example http://feedback-hub-litellm:4000/v1. When set, add
# FEEDBACK_HUB_LITELLM_API_KEY (the proxy master key) to the Secret above.
litellmBaseUrl: ""

# OTLP HTTP collector. Empty disables export. Example: http://feedback-hub-tempo:4318
otelEndpoint: ""

environment: staging

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi
