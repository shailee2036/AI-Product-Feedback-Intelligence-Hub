apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "feedback-hub-api.name" . }}
  labels:
    {{- include "feedback-hub-api.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "feedback-hub-api.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: TCP
          port: {{ .Values.service.port }}
