apiVersion: v1
kind: Service
metadata:
  name: {{ include "feedback-hub-api.name" . }}
  labels:
    {{- include "feedback-hub-api.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "feedback-hub-api.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
