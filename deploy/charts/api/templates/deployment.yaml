{{- if not .Values.existingSecret }}
{{- fail "existingSecret is required. Do not put credentials in values." }}
{{- end }}
{{- if or (not .Values.resources.requests.cpu) (not .Values.resources.limits.cpu) }}
{{- fail "CPU requests and limits are required." }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "feedback-hub-api.name" . }}
  labels:
    {{- include "feedback-hub-api.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "feedback-hub-api.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "feedback-hub-api.selectorLabels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: {{ include "feedback-hub-api.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          env:
            - name: FEEDBACK_HUB_ENVIRONMENT
              value: {{ .Values.environment | quote }}
            {{- with .Values.litellmBaseUrl }}
            - name: FEEDBACK_HUB_LITELLM_BASE_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.otelEndpoint }}
            - name: FEEDBACK_HUB_OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ . | quote }}
            {{- end }}
          envFrom:
            - secretRef:
                name: {{ .Values.existingSecret | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: tmp
          emptyDir: {}
